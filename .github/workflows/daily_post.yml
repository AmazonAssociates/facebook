name: Daily Category Movie Poster

on:
  schedule:
    - cron: '0 8 * * *' # Runs automatically once every day at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  post-movies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Bot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
        run: |
          python bot.py

      - name: Commit and Push Updated History (Prevent Duplicates)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_movies.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update posted movies history [skip ci]" && git push)
